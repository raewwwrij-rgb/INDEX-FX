<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOKO BAJU ONLINE SHOP - Lacak Pengiriman</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#eef2f7;color:#222}
header{background:#0b5ed7;color:#fff;padding:22px 16px;text-align:center}
header .logo{font-size:32px}
header h1{margin:6px 0 4px;font-size:24px}
header p{margin:0;opacity:.9;font-size:14px}
nav{display:flex;gap:8px;justify-content:center;background:#fff;padding:10px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.06)}
nav button{border:0;padding:10px 16px;border-radius:20px;cursor:pointer;font-weight:bold;background:#eef2f7}
nav button.active{background:#0b5ed7;color:#fff}
.wrap{max-width:720px;margin:16px auto;padding:0 12px 30px}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.07);margin-bottom:14px}
label{font-weight:bold;font-size:13px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0 12px;font-size:15px}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#0b5ed7;color:#fff;font-weight:bold;font-size:15px;cursor:pointer}
.btn.green{background:#25D366}
.btn.dark{background:#111}
.btn.small{width:auto;padding:8px 12px;font-size:13px}
.hidden{display:none}
.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.badge.proses{background:#fff3cd;color:#8a6d00}
.badge.kirim{background:#cfe2ff;color:#0b5ed7}
.badge.sampai{background:#d1e7dd;color:#0f5132}
.badge.batal{background:#f8d7da;color:#842029}
.timeline{border-left:3px solid #0b5ed7;padding-left:16px;margin-top:14px}
.timeline div{margin-bottom:14px}
.timeline b{display:block}
.timeline span{color:#666;font-size:13px}
.flex{display:flex;gap:8px;flex-wrap:wrap}
.item{border:1px solid #eee;border-radius:12px;padding:12px;margin-bottom:10px}
.item b{font-size:15px}
.muted{color:#666;font-size:13px}
.footer{text-align:center;color:#888;font-size:12px;margin-top:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid #eee;padding:8px;text-align:left}
</style>
</head>
<body>

<header>
  <div class="logo">👕</div>
  <h1 id="namaToko">TOKO BAJU ONLINE SHOP</h1>
  <p>Lacak pengiriman baju kamu, cepat & terpercaya</p>
</header>

<nav>
  <button id="btnLacak" class="active" onclick="showPage('lacak')">🔍 Lacak Paket</button>
  <button id="btnAdmin" onclick="showPage('admin')">⚙️ Admin</button>
  <button id="btnInfo" onclick="showPage('info')">ℹ️ Info</button>
</nav>

<div class="wrap">

<div id="page-lacak">
  <div class="card">
    <h2 style="margin-top:0">Cek Resi Pengiriman</h2>
    <label>Nomor Resi</label>
    <input id="inputResi" placeholder="Contoh: MK123456">
    <label>Ekspedisi</label>
    <select id="inputEkspedisi">
      <option>JNE</option><option>J&T Express</option><option>SiCepat</option>
      <option>Anteraja</option><option>Pos Indonesia</option><option>GoSend</option>
      <option>GrabExpress</option><option>Ninja Xpress</option><option>ID Express</option>
    </select>
    <button class="btn" onclick="lacakPaket()">LACAK SEKARANG</button>
    <p class="muted">Contoh resi demo: <b>MK123456</b> , <b>JP987654</b></p>
  </div>

  <div id="hasil" class="card hidden">
    <div id="hasilHeader"></div>
    <div class="timeline" id="hasilTimeline"></div>
    <div class="flex" style="margin-top:14px">
      <button class="btn green small" onclick="cekWA()">💬 Tanya via WhatsApp</button>
      <button class="btn dark small" onclick="salinResi()">📋 Salin Resi</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Riwayat Pencarian Terakhir</h3>
    <div id="riwayat"></div>
  </div>
</div>

<div id="page-admin" class="hidden">
  <div class="card">
    <h2 style="margin-top:0">Tambah / Update Paket</h2>
    <label>Nomor Resi</label><input id="aResi" placeholder="MK123456">
    <label>Nama Penerima</label><input id="aNama" placeholder="Nama pembeli">
    <label>Kota Tujuan</label><input id="aKota" placeholder="Contoh: Jakarta">
    <label>Ekspedisi</label>
    <select id="aEkspedisi"><option>JNE</option><option>J&T Express</option><option>SiCepat</option><option>Anteraja</option><option>Pos Indonesia</option></select>
    <label>Status</label>
    <select id="aStatus"><option>Pesanan Diproses</option><option>Dalam Perjalanan</option><option>Sampai di Kota Tujuan</option><option>Sedang Diantar Kurir</option><option>Paket Diterima</option></select>
    <label>Catatan / Update Terakhir</label><textarea id="aCatatan" rows="2" placeholder="Contoh: Paket sudah tiba di gudang Jakarta"></textarea>
    <button class="btn" onclick="simpanPaket()">SIMPAN PAKET</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Daftar Paket</h3>
    <div id="daftarPaket"></div>
    <button class="btn dark" onclick="resetDemo()" style="margin-top:12px">Reset ke Data Demo</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Pengaturan Toko</h3>
    <label>Nama Toko</label><input id="setNama" value="TOKO BAJU ONLINE SHOP">
    <label>Nomor WhatsApp (62...)</label><input id="setWA" value="6287747044140">
    <button class="btn" onclick="simpanPengaturan()">SIMPAN PENGATURAN</button>
    <p class="muted">Nomor aktif
